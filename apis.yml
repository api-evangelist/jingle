aid: jingle
name: Jingle
description: >-
  Jingle is a consumer marketplace mobile app for fast, direct local deliveries from mobile
  stores and services — "shops-on-wheels" — operating in the San Francisco Bay Area. Users sign
  up with a phone number (no password) and enable push notifications to be alerted when their
  favorite mobile vendors are nearby — artisanal food trucks, farmers'-market sellers, and
  one-click services such as bike repair, car wash, manicures, pedicures, and knife sharpening —
  then request a "jingle" to summon them. Deliveries are handled directly by the businesses
  themselves, cutting out delivery middlemen. Merchants use the app at their discretion to
  broadcast their presence to nearby neighborhoods, and residential complexes can partner to
  bring vendors on-site. Jingle is a portfolio company of Bessemer Venture Partners. The company
  publishes no public API, developer portal, or SDK; this profile captures its public consumer
  and merchant surface.
